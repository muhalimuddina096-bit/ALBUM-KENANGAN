<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our 10 Months Journey ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ==================== STYLE HALAMAN AWAL (INTRO) ==================== */
        #introScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffccd5, #fff0f3, #ffffff); 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            text-align: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .intro-text {
            font-size: 2rem;
            font-weight: 600;
            line-height: 1.5;
            max-width: 700px;
            margin-bottom: 40px;
            color: #4a0e17; 
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
            animation: fadeInDown 1s ease-out;
        }

        .btn-buka {
            background: #ff4d6d; 
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.3);
            animation: pulse 2s infinite;
        }

        .btn-buka:hover {
            background: #ff758f;
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 117, 143, 0.5);
        }

        /* ==================== STYLE ALBUM UTAMA ==================== */
        #mainAlbum {
            display: none;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            position: relative;
            opacity: 0;
            transition: opacity 1s ease;
            padding: 20px;
        }

        .bg-slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-size: cover;
            background-position: center;
            filter: blur(10px) brightness(40%);
            /* TRANSISI TRANSFORMAASI OPACITY YANG HALUS */
            transition: opacity 0.6s ease-in-out; 
            opacity: 1;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: rgba(0, 0, 0, 0.1);
        }

        .container {
            text-align: center;
            max-width: 550px;
            width: 95%;
        }

        .album-title {
            font-size: 1.2rem;
            margin-bottom: 20px;
            opacity: 0.9;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }

        .album-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            padding-top: 125%;
            overflow: hidden;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .image-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* TRANSISI UNTUK FOTO UTAMA DI TENGAH */
            transition: transform 0.4s ease, opacity 0.6s ease-in-out;
            opacity: 1;
        }

        .image-wrapper:hover img {
            transform: scale(1.02);
        }

        .click-hint {
            margin-top: 15px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
            font-style: italic;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
        }

        .counter {
            margin-top: 10px;
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 14px;
            border-radius: 20px;
            display: inline-block;
            letter-spacing: 1px;
        }

        /* ==================== KEYFRAMES ANIMASI ==================== */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 5px 15px rgba(255, 77, 109, 0.3); }
            50% { transform: scale(1.03); box-shadow: 0 5px 25px rgba(255, 77, 109, 0.6); }
            100% { transform: scale(1); box-shadow: 0 5px 15px rgba(255, 77, 109, 0.3); }
        }
    </style>
</head>
<body>

    <!-- TAG AUDIO ELEMEN (Ubah src="musik.mp3" sesuai lagu pilihanmu) -->
    <audio id="bgMusic" src="musik.mp3" loop></audio>

    <!-- HALAMAN AWAL: GRADASI PINK PUTIH -->
    <div id="introScreen">
        <h1 class="intro-text">sayangggggg ini wab album perjalanan hubungan kita selama 10 bulan ini ❤️</h1>
        <button class="btn-buka" onclick="bukaAlbum()">Klik untuk Buka Album ✨</button>
    </div>

    <!-- HALAMAN UTAMA ALBUM FOTO -->
    <div id="mainAlbum">
        <div class="bg-slideshow" id="bgSlideshow"></div>
        <div class="overlay"></div>

        <div class="container">
            <p class="album-title">Our 10 Months Memories 💕</p>
            <div class="album-card">
                <div class="image-wrapper" onclick="gantiFotoBerikutnya()">
                    <img id="fotoUtama" src="" alt="Momen Indah Kita">
                </div>
                <div class="click-hint">✨ Klik fotonya untuk momen selanjutnya ✨</div>
                <div class="counter" id="statusFoto">Foto 1 dari 20</div>
            </div>
        </div>
    </div>

    <script>
        // Daftar 20 file foto kamu
        const daftarFoto = [
            "foto1.jpg", "foto2.jpg", "foto3.jpg", "foto4.jpg", "foto5.jpg",
            "foto6.jpg", "foto7.jpg", "foto8.jpg", "foto9.jpg", "foto10.jpg",
            "foto11.jpg", "foto12.jpg", "foto13.jpg", "foto14.jpg", "foto15.jpg",
            "foto16.jpg", "foto17.jpg", "foto18.jpg", "foto19.jpg", "foto20.jpg"
        ];

        let indexSaatIni = 0;
        let pemicuOtomatis;

        const intro = document.getElementById('introScreen');
        const album = document.getElementById('mainAlbum');
        const fotoUtama = document.getElementById('fotoUtama');
        const bgSlideshow = document.getElementById('bgSlideshow');
        const statusFoto = document.getElementById('statusFoto');
        const laguLatar = document.getElementById('bgMusic');

        function bukaAlbum() {
            laguLatar.play().catch(error => {
                console.log("Audio tertahan keamanan browser:", error);
            });

            intro.style.opacity = '0';
            intro.style.visibility = 'hidden';

            album.style.display = 'flex';
            setTimeout(() => {
                album.style.opacity = '1';
            }, 50);

            // Tampilkan foto pertama tanpa animasi memudar di awal buka
            fotoUtama.src = daftarFoto[indexSaatIni];
            bgSlideshow.style.backgroundImage = `url('${daftarFoto[indexSaatIni]}')`;
            statusFoto.innerText = `Foto ${indexSaatIni + 1} dari ${daftarFoto.length}`;

            mulaiTimerOtomatis();
        }

        // FUNGSI UTAMA UNTUK TRANSISI HALUS SINKRON (ANTI-BOM-DUAR)
        function sinkronkanFotoDanBg() {
            // Langkah 1: Samarkan foto utama dan background sampai tidak terlihat (Opacity = 0)
            fotoUtama.style.opacity = '0';
            bgSlideshow.style.opacity = '0';
            
            // Langkah 2: Tunggu 400 milidetik (saat layar sudah blur/gelap sempurna), baru tukar filenya
            setTimeout(() => {
                fotoUtama.src = daftarFoto[indexSaatIni];
                bgSlideshow.style.backgroundImage = `url('${daftarFoto[indexSaatIni]}')`;
                statusFoto.innerText = `Foto ${indexSaatIni + 1} dari ${daftarFoto.length}`;
                
                // Langkah 3: Munculkan kembali foto baru secara perlahan (Opacity = 1)
                fotoUtama.style.opacity = '1';
                bgSlideshow.style.opacity = '1';
            }, 400); 
        }

        function gantiFotoBerikutnya() {
            clearInterval(pemicuOtomatis);
            indexSaatIni = (indexSaatIni + 1) % daftarFoto.length;
            sinkronkanFotoDanBg();
            mulaiTimerOtomatis();
        }

        function mulaiTimerOtomatis() {
            pemicuOtomatis = setInterval(() => {
                indexSaatIni = (indexSaatIni + 1) % daftarFoto.length;
                sinkronkanFotoDanBg();
            }, 5000); // Berganti otomatis setiap 5 detik
        }
    </script>
</body>
</html>
