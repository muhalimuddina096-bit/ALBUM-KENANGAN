<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our 10 Months Journey ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            color: #fff;
        }

        /* Background otomatis ganti-ganti */
        .bg-slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(50%); /* Bikin bg agak blur & gelap supaya teks terbaca */
            transition: background-image 1.5s ease-in-out;
        }

        /* Overlay tambahan biar estetik */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: rgba(0, 0, 0, 0.2);
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 90%;
            padding: 20px;
            z-index: 1;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 30px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            line-height: 1.4;
            animation: fadeInDown 1s ease-out;
        }

        /* Kotak Bingkai Foto Utama (Glassmorphism) */
        .album-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            animation: scaleUp 0.8s ease-out;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            padding-top: 125%; /* Rasio foto portrait 4:5, biar rapi */
            overflow: hidden;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .image-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease, opacity 0.3s ease;
        }

        /* Efek hover pas mouse di atas foto */
        .image-wrapper:hover img {
            transform: scale(1.03);
        }

        .click-hint {
            margin-top: 15px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
            font-style: italic;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
        }

        .counter {
            margin-top: 10px;
            font-size: 0.85rem;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        /* Animasi masuk */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="bg-slideshow" id="bgSlideshow"></div>
    <div class="overlay"></div>

    <div class="container">
        <!-- Tulisan awal sesuai request kamu -->
        <h1>sayangggggg ini wab album perjalanan hubungan kita selama 10 bulan ini ❤️</h1>

        <div class="album-card">
            <div class="image-wrapper" onclick="gantiFotoManual()">
                <img id="fotoUtama" src="" alt="Momen Kita">
            </div>
            <div class="click-hint">✨ Klik fotonya untuk lihat momen selanjutnya ✨</div>
            <div class="counter" id="statusFoto">Foto 1 dari 1</div>
        </div>
    </div>

    <script>
        // ==========================================
        // SILAKAN MASUKKAN NAMA-NAMA FOTO KAMU DI SINI
        // ==========================================
        // Pastikan nama file dan ekstensinya (jpg/png) sama persis ya!
        const daftarFoto = [
            "ADEEEEEEEK.jpeg",
            "ARSYA.png",
            "foto3.jpg",
            "BOCILLLLLLLLLLLLL.jpeg",
            "foto5.jpg"
        ];

        let indeksManual = 0;
        let indeksBackground = 0;

        const elemenFotoUtama = document.getElementById('fotoUtama');
        const elemenBgSlideshow = document.getElementById('bgSlideshow');
        const elemenStatusFoto = document.getElementById('statusFoto');

        // Fungsi inisialisasi awal saat web dibuka
        function mulaiAlbum() {
            if (daftarFoto.length > 0) {
                // Set foto utama pertama kali
                elemenFotoUtama.src = daftarFoto[indeksManual];
                // Set background pertama kali
                elemenBgSlideshow.style.backgroundImage = `url('${daftarFoto[indeksBackground]}')`;
                
                updateStatusCounter();
                
                // Mulai ganti background otomatis setiap 4 detik (4000ms)
                setInterval(gantiBgOtomatis, 4000);
            }
        }

        // Fungsi ketika foto utama di-klik (Ganti manual)
        function gantiFotoManual() {
            // Efek transisi halus saat klik ganti foto
            elemenFotoUtama.style.opacity = '0';
            
            setTimeout(() => {
                indeksManual = (indeksManual + 1) % daftarFoto.length;
                elemenFotoUtama.src = daftarFoto[indeksManual];
                elemenFotoUtama.style.opacity = '1';
                updateStatusCounter();
            }, 200);
        }

        // Fungsi ganti background otomatis
        function gantiBgOtomatis() {
            indeksBackground = (indeksBackground + 1) % daftarFoto.length;
            elemenBgSlideshow.style.backgroundImage = `url('${daftarFoto[indeksBackground]}')`;
        }

        // Fungsi penunjuk jumlah foto saat ini
        function updateStatusCounter() {
            elemenStatusFoto.innerText = `Foto ${indeksManual + 1} dari ${daftarFoto.length}`;
        }

        // Jalankan sistem begitu halaman selesai dimuat
        window.onload = mulaiAlbum;
    </script>
</body>
</html>
